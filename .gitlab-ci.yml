stages:
  - build-base
  - build
  - deploy
  - test

variables:
  GIT_STRATEGY: clone
  CONTAINER_GALAXY_URL: "${NDIP_DOCKER_REPOSITORY}/${CI_PROJECT_PATH}"
  CONTAINER_GALAXY_BASE_URL: "${CONTAINER_GALAXY_URL}/base"
  CONTAINER_GALAXY_COMMIT_URL: "${CONTAINER_GALAXY_URL}/commit"
  GALAXY_VERSION_PYTHON: 26.1.dev12+ornl
  GALAXY_VERSION_DOCKER: 26.1.dev12.ornl

# This import is for the func_rse_docker_* functions
before_script:
  - curl https://code.ornl.gov/rse-deployment/rse-sharables/raw/master/rse-bash-modules.sh -O
  - docker login -u $NDIP_DOCKER_USER -p $NDIP_DOCKER_PASSWORD $NDIP_DOCKER_REPOSITORY
  - source rse-bash-modules.sh
  - func_rse_docker_cleanup

after_script:
  - curl https://code.ornl.gov/rse-deployment/rse-sharables/raw/master/rse-bash-modules.sh -O
  - source rse-bash-modules.sh
  - func_rse_docker_cleanup
  - sudo chown -R gitlab-runner .

service-build:
  stage: build
  script:
    - cp .dockerignore.src .dockerignore
    # this branch's own base if build-base-docker pushed one, else the shared base:latest
    - |
      BASE_TAG=latest
      if docker manifest inspect $CONTAINER_GALAXY_BASE_URL:$CI_COMMIT_REF_SLUG > /dev/null 2>&1; then
        BASE_TAG=$CI_COMMIT_REF_SLUG
      fi
      echo "Building on base:$BASE_TAG"
    - >
      docker build
      --build-arg BASE_TAG=$BASE_TAG
      -f dockerfiles/Dockerfile
      -t galaxy .
    - docker tag galaxy $CONTAINER_GALAXY_COMMIT_URL:build-$CI_COMMIT_SHORT_SHA
    - docker push $CONTAINER_GALAXY_COMMIT_URL:build-$CI_COMMIT_SHORT_SHA
  tags:
    - rse-multi-builder

client-tests:
  stage: test
  needs: [service-build]
  script:
    - >    
      docker run
      --entrypoint=""
      $CONTAINER_GALAXY_COMMIT_URL:build-$CI_COMMIT_SHORT_SHA
      bash -c "make client-test"
  tags:
    - rse-multi-builder

