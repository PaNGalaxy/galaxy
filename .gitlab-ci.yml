unit-tests:
  stage: test
  variables:
    # Tool Shed fixture SQLite database is not always available/extractable in CI.
    GALAXY_UNIT_TEST_SKIP_EXPRESSION: "not test_build_index and not postgres_app"
  script:
    - >    
      docker run
      --entrypoint=""
      $CONTAINER_GALAXY_COMMIT_URL:build-$CI_COMMIT_SHORT_SHA
      bash -c "GALAXY_SKIP_EXTERNAL_DEPENDENCY_MANAGEMENT=1 ./run_tests.sh -unit 'lib test/unit' -- -k '$GALAXY_UNIT_TEST_SKIP_EXPRESSION'"
  tags:
    - rse-multi-builder
  except:
      - docker-base

build-base-docker:
  stage: build-base
  only:
    - docker-base
  script:
    - cp .dockerignore.full .dockerignore
    - >    
      docker build
      -f dockerfiles/Dockerfile.full
      -t galaxy-base .
    - docker tag galaxy-base $CONTAINER_GALAXY_BASE_URL:$GALAXY_VERSION_DOCKER
    - docker tag galaxy-base $CONTAINER_GALAXY_BASE_URL:latest
    - docker push $CONTAINER_GALAXY_BASE_URL:$GALAXY_VERSION_DOCKER
    - docker push $CONTAINER_GALAXY_BASE_URL:latest
  tags:
    - rse-multi-builder


package:
  stage: deploy
  script:
    - >
      docker run
      -e GALAXY_VERSION_PYTHON
      -e CI_JOB_TOKEN
      -e CI_API_V4_URL
      -e CI_PROJECT_ID
      $CONTAINER_GALAXY_COMMIT_URL:build-$CI_COMMIT_SHORT_SHA
      bash -lc '
      . .venv/bin/activate &&
      pip install uv build twine pkginfo==1.12.1.2 &&
      cd packages &&
      find . -mindepth 2 -maxdepth 2 -name setup.cfg -exec sed -i -e "s/^version =.*/version = ${GALAXY_VERSION_PYTHON}/" {} + &&
      while read -r package; do
        [ -n "$package" ] || continue;
        case "$package" in \#*) continue ;; esac;
        echo "Building package: $package";
        make -C "$package" dist;
      done < packages_by_dep_dag.txt &&
      TWINE_PASSWORD="${CI_JOB_TOKEN}" TWINE_USERNAME=gitlab-ci-token python3 -m twine upload --repository-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" ./*/dist/*
      '
  when: manual
  except:
      - docker-base
  tags:
    - rse-multi-builder

tag-docker:
  stage: deploy
  script:
    - docker pull $CONTAINER_GALAXY_COMMIT_URL:build-$CI_COMMIT_SHORT_SHA
    - docker tag $CONTAINER_GALAXY_COMMIT_URL:build-$CI_COMMIT_SHORT_SHA $CONTAINER_GALAXY_URL:$GALAXY_VERSION_DOCKER
    - docker push $CONTAINER_GALAXY_URL:$GALAXY_VERSION_DOCKER
  when: manual
  except:
      - docker-base
  tags:
    - rse-multi-builder
